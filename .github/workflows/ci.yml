name: CI - Validate Lambda Code

on:
  push:
    branches:
      - devLab5

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install flake8

      - name: Lint Lambda code
        run: |
          flake8 lambdas/
